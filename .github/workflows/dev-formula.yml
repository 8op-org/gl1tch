name: Update glitch-dev formula

on:
  push:
    branches: [main]
    paths:
      - 'bb/**'
      - 'bb.edn'

permissions:
  contents: read

jobs:
  update-dev-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/8op-org/homebrew-tap.git" "$WORK/tap"
          cd "$WORK/tap"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/.github/formula-dev-template.rb" Formula/glitch-dev.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/glitch-dev.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "glitch-dev ${COMMIT_SHA:0:7}"
          git push
