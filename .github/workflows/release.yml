name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="glitch_${VERSION}.tar.gz"
          tar czf "${ARCHIVE}" \
            -C bb src providers resources/ast-grep-rules
          SHA=$(sha256sum "${ARCHIVE}" | awk '{print $1}')
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
              | grep -vE "^- (chore|docs|ci|test)" > changelog.md || true
          else
            echo "Initial release" > changelog.md
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "glitch $GITHUB_REF_NAME" \
            --notes-file changelog.md \
            "${ARCHIVE}"
      - name: Generate Homebrew formula
        run: |
          BASE_URL="https://github.com/8op-org/gl1tch/releases/download/v${VERSION}"
          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__BASE_URL__|${BASE_URL}|g" \
            -e "s|__SHA__|${SHA}|g" \
            .github/formula-template.rb > formula.rb
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/8op-org/homebrew-tap.git" "$WORK/tap"
          cd "$WORK/tap"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/formula.rb" Formula/glitch.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/glitch.rb
          git commit -m "glitch ${VERSION}"
          git push
